<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos & Parciales — Drakonian Peach Society</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Carga de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: #121520;
      --accent-orange: #ff6b35;
      --accent-blue: #00d2ff;
      --text-main: #f0f3f8;
      --text-muted: #94a3b8;
      --border-color: #23293e;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      padding: 2.5rem 1rem 1.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(circle at top, rgba(255, 107, 53, 0.08) 0%, transparent 70%);
    }

    header h1 {
      margin: 0;
      font-size: 2.3rem;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.6rem;
      font-size: 1.05rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    /* Banner Principal */
    .upload-banner {
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.12), rgba(0, 210, 255, 0.08));
      border: 1px dashed rgba(255, 107, 53, 0.4);
      border-radius: 14px;
      padding: 1.8rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .upload-banner h2 {
      margin-top: 0;
      font-size: 1.45rem;
      color: #fff;
    }

    .upload-banner p {
      color: var(--text-muted);
      max-width: 650px;
      margin: 0.5rem auto 1.2rem auto;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--accent-orange);
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.95rem;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      background: #e05a2b;
    }

    .btn-telegram {
      background: #0088cc;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      transition: transform 0.2s;
    }

    .btn-telegram:hover {
      transform: translateY(-2px);
    }

    /* Formulario Integrado (Inline) */
    .upload-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 2rem;
      margin-bottom: 2.5rem;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drop-zone {
      border: 2px dashed rgba(0, 210, 255, 0.4);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      background: rgba(0, 210, 255, 0.03);
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      cursor: pointer;
    }

    .privacy-notice {
      background: rgba(255, 107, 53, 0.08);
      border-left: 3px solid var(--accent-orange);
      padding: 0.8rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #e0e6ed;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.88rem;
      color: #d0d7e5;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 0.7rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
